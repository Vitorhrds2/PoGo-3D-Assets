<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex 3D - Gen 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #dc0a2d;
            --dark-red: #a00020;
            --light-red: #ff3355;
            --screen-bg: #98cb98;
            --screen-dark: #1a1a2e;
            --gold: #ffd700;
            --silver: #c0c0c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(145deg, #0f0f23 0%, #1a1a3e 50%, #0a0a1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Pokédex Container */
        .pokedex {
            display: flex;
            gap: 10px;
            max-width: 1200px;
            width: 100%;
            perspective: 2000px;
        }

        /* Left Panel - Main Screen */
        .pokedex-left {
            background: linear-gradient(145deg, var(--primary-red) 0%, var(--dark-red) 100%);
            border-radius: 20px 5px 5px 20px;
            padding: 25px;
            flex: 1.2;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.3);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .pokedex-left:hover {
            transform: rotateY(-2deg) rotateX(1deg);
        }

        /* Top Lights */
        .top-lights {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .big-light {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3dc7ef 0%, #1a9ecb 50%, #0d7aa3 100%);
            border: 4px solid #f0f0f0;
            box-shadow: 
                0 0 20px rgba(61, 199, 239, 0.6),
                inset 0 -10px 20px rgba(0,0,0,0.3),
                inset 0 5px 10px rgba(255,255,255,0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(61, 199, 239, 0.6), inset 0 -10px 20px rgba(0,0,0,0.3), inset 0 5px 10px rgba(255,255,255,0.4); }
            50% { box-shadow: 0 0 40px rgba(61, 199, 239, 0.9), inset 0 -10px 20px rgba(0,0,0,0.3), inset 0 5px 10px rgba(255,255,255,0.4); }
        }

        .small-lights {
            display: flex;
            gap: 8px;
        }

        .small-light {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .small-light.red { background: linear-gradient(145deg, #ff6b6b, #cc0000); box-shadow: 0 0 8px rgba(255,0,0,0.5); }
        .small-light.yellow { background: linear-gradient(145deg, #ffeb3b, #ffc107); box-shadow: 0 0 8px rgba(255,235,59,0.5); }
        .small-light.green { background: linear-gradient(145deg, #4caf50, #2e7d32); box-shadow: 0 0 8px rgba(76,175,80,0.5); animation: blink 1s infinite; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Screen */
        .main-screen {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            border: 8px solid #333;
            box-shadow: 
                inset 0 5px 15px rgba(0,0,0,0.5),
                0 5px 15px rgba(0,0,0,0.3);
        }

        .screen-inner {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a3a 100%);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Pokemon Display */
        .pokemon-display {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pokemon-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: float 3s ease-in-out infinite;
            cursor: grab;
            transition: transform 0.1s ease;
            image-rendering: pixelated;
        }

        .pokemon-image:active {
            cursor: grabbing;
        }

        .pokemon-image.dragging {
            animation: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        /* Glow Ring */
        .glow-ring {
            position: absolute;
            bottom: -20px;
            width: 150px;
            height: 30px;
            background: radial-gradient(ellipse, rgba(255,255,255,0.3) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Pokemon Info on Screen */
        .pokemon-screen-info {
            text-align: center;
            margin-top: 15px;
        }

        .pokemon-id {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .pokemon-name-display {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Screen Indicators */
        .screen-indicators {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            animation: blink 2s infinite;
        }

        /* Bottom Controls */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 0 10px;
        }

        .speaker-grills {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .speaker-grill {
            width: 50px;
            height: 4px;
            background: linear-gradient(90deg, #111 0%, #333 50%, #111 100%);
            border-radius: 2px;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-prev, .btn-next {
            background: linear-gradient(145deg, #333, #222);
            color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn-prev:hover, .btn-next:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .btn-prev:active, .btn-next:active {
            transform: scale(0.95);
        }

        /* Right Panel - Info */
        .pokedex-right {
            background: linear-gradient(145deg, var(--primary-red) 0%, var(--dark-red) 100%);
            border-radius: 5px 20px 20px 5px;
            padding: 25px;
            flex: 1;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -2px 4px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .pokedex-right:hover {
            transform: rotateY(2deg) rotateX(1deg);
        }

        /* Info Screen */
        .info-screen {
            background: linear-gradient(180deg, #2d4a2d 0%, #1a3a1a 100%);
            border-radius: 8px;
            padding: 15px;
            border: 4px solid #333;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .info-title {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .info-content {
            font-size: 0.85rem;
            color: #98fb98;
            line-height: 1.5;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Types Display */
        .types-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .type-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .type-normal { background: linear-gradient(135deg, #a8a878, #6d6d4e); }
        .type-fire { background: linear-gradient(135deg, #f08030, #9c531f); }
        .type-water { background: linear-gradient(135deg, #6890f0, #445e9c); }
        .type-electric { background: linear-gradient(135deg, #f8d030, #a1871f); }
        .type-grass { background: linear-gradient(135deg, #78c850, #4e8234); }
        .type-ice { background: linear-gradient(135deg, #98d8d8, #638d8d); }
        .type-fighting { background: linear-gradient(135deg, #c03028, #7d1f1a); }
        .type-poison { background: linear-gradient(135deg, #a040a0, #682a68); }
        .type-ground { background: linear-gradient(135deg, #e0c068, #927d44); }
        .type-flying { background: linear-gradient(135deg, #a890f0, #6d5e9c); }
        .type-psychic { background: linear-gradient(135deg, #f85888, #a13959); }
        .type-bug { background: linear-gradient(135deg, #a8b820, #6d7815); }
        .type-rock { background: linear-gradient(135deg, #b8a038, #786824); }
        .type-ghost { background: linear-gradient(135deg, #705898, #493963); }
        .type-dragon { background: linear-gradient(135deg, #7038f8, #4924a1); }
        .type-dark { background: linear-gradient(135deg, #705848, #49392f); }
        .type-steel { background: linear-gradient(135deg, #b8b8d0, #787887); }
        .type-fairy { background: linear-gradient(135deg, #ee99ac, #9b6470); }

        /* Stats Display */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-label {
            width: 40px;
            font-size: 0.7rem;
            color: #98fb98;
            font-weight: 600;
        }

        .stat-bar-container {
            flex: 1;
            height: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            overflow: hidden;
        }

        .stat-bar {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .stat-value {
            width: 30px;
            font-size: 0.7rem;
            color: #98fb98;
            text-align: right;
        }

        .stat-hp .stat-bar { background: linear-gradient(90deg, #ff5555, #55ff55); }
        .stat-atk .stat-bar { background: linear-gradient(90deg, #f08030, #ffaa55); }
        .stat-def .stat-bar { background: linear-gradient(90deg, #6890f0, #88b0ff); }
        .stat-spa .stat-bar { background: linear-gradient(90deg, #f85888, #ff88a8); }
        .stat-spd .stat-bar { background: linear-gradient(90deg, #78c850, #98e870); }
        .stat-spe .stat-bar { background: linear-gradient(90deg, #f8d030, #ffee77); }

        /* Pokemon Grid */
        .pokemon-grid-container {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a3a 100%);
            border-radius: 8px;
            padding: 10px;
            border: 4px solid #333;
            max-height: 200px;
            overflow-y: auto;
        }

        .pokemon-grid-container::-webkit-scrollbar {
            width: 8px;
        }

        .pokemon-grid-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .pokemon-grid-container::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .pokemon-grid-item {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid transparent;
            overflow: hidden;
        }

        .pokemon-grid-item:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.05);
        }

        .pokemon-grid-item.active {
            border-color: var(--gold);
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        .pokemon-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* D-Pad */
        .d-pad-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .d-pad {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .d-pad-btn {
            position: absolute;
            width: 35px;
            height: 35px;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 1rem;
            transition: all 0.1s ease;
        }

        .d-pad-btn:hover {
            background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
            color: #fff;
        }

        .d-pad-btn:active {
            transform: scale(0.95);
        }

        .d-pad-up { top: 0; left: 50%; transform: translateX(-50%); border-radius: 8px 8px 0 0; }
        .d-pad-down { bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 0 0 8px 8px; }
        .d-pad-left { left: 0; top: 50%; transform: translateY(-50%); border-radius: 8px 0 0 8px; }
        .d-pad-right { right: 0; top: 50%; transform: translateY(-50%); border-radius: 0 8px 8px 0; }
        .d-pad-center { top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; width: 30px; height: 30px; background: #1a1a1a; }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pokeball-loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ff0000 0%, #ff0000 45%, #222 45%, #222 55%, #ffffff 55%, #ffffff 100%);
            position: relative;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 30px rgba(255,0,0,0.5);
        }

        .pokeball-loader::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #222;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: var(--gold);
            letter-spacing: 3px;
        }

        /* Physical Details */
        .physical-info {
            display: flex;
            gap: 20px;
        }

        .physical-stat {
            text-align: center;
        }

        .physical-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: #fff;
        }

        .physical-label {
            font-size: 0.7rem;
            color: rgba(152, 251, 152, 0.7);
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .pokedex {
                flex-direction: column;
            }

            .pokedex-left, .pokedex-right {
                border-radius: 20px;
            }

            .pokedex-left:hover, .pokedex-right:hover {
                transform: none;
            }

            .pokemon-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 500px) {
            .pokemon-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .big-light {
                width: 50px;
                height: 50px;
            }

            .pokemon-image {
                width: 140px;
                height: 140px;
            }
        }

        /* 3D Rotation Effect */
        .pokemon-3d-container {
            perspective: 1000px;
        }

        .pokemon-image.rotated {
            transform-style: preserve-3d;
        }

        /* Shine effect */
        .pokemon-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 3s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 200%; }
        }

        /* Cry button */
        .cry-btn {
            background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: #98fb98;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .cry-btn:hover {
            background: linear-gradient(145deg, #5a5a5a, #4a4a4a);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading">
        <div class="pokeball-loader"></div>
        <div class="loading-text">LOADING POKÉDEX...</div>
    </div>

    <div class="pokedex">
        <!-- Left Panel -->
        <div class="pokedex-left">
            <!-- Top Lights -->
            <div class="top-lights">
                <div class="big-light"></div>
                <div class="small-lights">
                    <div class="small-light red"></div>
                    <div class="small-light yellow"></div>
                    <div class="small-light green"></div>
                </div>
            </div>

            <!-- Main Screen -->
            <div class="main-screen">
                <div class="screen-inner">
                    <div class="pokemon-3d-container">
                        <div class="pokemon-display">
                            <img src="" alt="Pokemon" class="pokemon-image" id="pokemon-image" draggable="false">
                            <div class="glow-ring"></div>
                        </div>
                    </div>
                    <div class="pokemon-screen-info">
                        <div class="pokemon-id" id="pokemon-id">Nº 001</div>
                        <div class="pokemon-name-display" id="pokemon-name">BULBASAUR</div>
                    </div>
                    <div class="screen-indicators">
                        <div class="indicator">
                            <div class="indicator-dot"></div>
                            <span>LIVE</span>
                        </div>
                        <div class="indicator">
                            <span id="connection-status">● CONNECTED</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <div class="speaker-grills">
                    <div class="speaker-grill"></div>
                    <div class="speaker-grill"></div>
                    <div class="speaker-grill"></div>
                    <div class="speaker-grill"></div>
                </div>
                <div class="control-buttons">
                    <button class="control-btn btn-prev" id="btn-prev">◀</button>
                    <button class="control-btn btn-next" id="btn-next">▶</button>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="pokedex-right">
            <!-- Types -->
            <div class="info-screen">
                <div class="info-title">TYPE</div>
                <div class="types-container" id="pokemon-types"></div>
            </div>

            <!-- Description -->
            <div class="info-screen">
                <div class="info-title">DATA</div>
                <div class="info-content" id="pokemon-description">Loading...</div>
                <div class="physical-info" style="margin-top: 15px;">
                    <div class="physical-stat">
                        <div class="physical-value" id="pokemon-height">0.7m</div>
                        <div class="physical-label">Height</div>
                    </div>
                    <div class="physical-stat">
                        <div class="physical-value" id="pokemon-weight">6.9kg</div>
                        <div class="physical-label">Weight</div>
                    </div>
                </div>
                <button class="cry-btn" id="cry-btn">▶ PLAY CRY</button>
            </div>

            <!-- Stats -->
            <div class="info-screen">
                <div class="info-title">BASE STATS</div>
                <div class="stats-container" id="pokemon-stats"></div>
            </div>

            <!-- Pokemon Grid -->
            <div class="pokemon-grid-container">
                <div class="pokemon-grid" id="pokemon-grid"></div>
            </div>

            <!-- D-Pad -->
            <div class="d-pad-container">
                <div class="d-pad">
                    <button class="d-pad-btn d-pad-up" id="dpad-up">▲</button>
                    <button class="d-pad-btn d-pad-down" id="dpad-down">▼</button>
                    <button class="d-pad-btn d-pad-left" id="dpad-left">◀</button>
                    <button class="d-pad-btn d-pad-right" id="dpad-right">▶</button>
                    <div class="d-pad-center"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Pokemon data cache
        const pokemonCache = {};
        const speciesCache = {};
        let currentPokemonId = 1;
        let audioContext = null;

        // Gen 1 Pokemon IDs (1-151)
        const GEN1_COUNT = 151;

        // DOM Elements
        const pokemonImage = document.getElementById('pokemon-image');
        const pokemonId = document.getElementById('pokemon-id');
        const pokemonName = document.getElementById('pokemon-name');
        const pokemonTypes = document.getElementById('pokemon-types');
        const pokemonDescription = document.getElementById('pokemon-description');
        const pokemonStats = document.getElementById('pokemon-stats');
        const pokemonHeight = document.getElementById('pokemon-height');
        const pokemonWeight = document.getElementById('pokemon-weight');
        const pokemonGrid = document.getElementById('pokemon-grid');
        const loadingOverlay = document.getElementById('loading');
        const cryBtn = document.getElementById('cry-btn');

        // Initialize
        async function init() {
            setupEventListeners();
            await createPokemonGrid();
            await loadPokemon(1);
            loadingOverlay.classList.add('hidden');
        }

        // Create Pokemon Grid
        async function createPokemonGrid() {
            pokemonGrid.innerHTML = '';
            
            for (let i = 1; i <= GEN1_COUNT; i++) {
                const item = document.createElement('div');
                item.className = 'pokemon-grid-item';
                item.dataset.id = i;
                
                const img = document.createElement('img');
                img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${i}.png`;
                img.alt = `Pokemon #${i}`;
                img.loading = 'lazy';
                
                item.appendChild(img);
                item.addEventListener('click', () => loadPokemon(i));
                pokemonGrid.appendChild(item);
            }
        }

        // Load Pokemon Data
        async function loadPokemon(id) {
            currentPokemonId = id;
            
            // Update active grid item
            document.querySelectorAll('.pokemon-grid-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.id) === id);
            });

            try {
                // Fetch Pokemon data
                let pokemon = pokemonCache[id];
                if (!pokemon) {
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                    pokemon = await response.json();
                    pokemonCache[id] = pokemon;
                }

                // Fetch species data for description
                let species = speciesCache[id];
                if (!species) {
                    const speciesResponse = await fetch(pokemon.species.url);
                    species = await speciesResponse.json();
                    speciesCache[id] = species;
                }

                // Update UI
                updatePokemonDisplay(pokemon, species);
            } catch (error) {
                console.error('Error loading Pokemon:', error);
            }
        }

        // Update Pokemon Display
        function updatePokemonDisplay(pokemon, species) {
            // Image - use official artwork or animated sprite
            const artworkUrl = pokemon.sprites.other['official-artwork'].front_default;
            const animatedUrl = pokemon.sprites.versions?.['generation-v']?.['black-white']?.animated?.front_default;
            pokemonImage.src = animatedUrl || artworkUrl || pokemon.sprites.front_default;
            
            // Reset any rotation
            pokemonImage.style.transform = '';
            
            // ID and Name
            pokemonId.textContent = `Nº ${String(pokemon.id).padStart(3, '0')}`;
            pokemonName.textContent = pokemon.name.toUpperCase();

            // Types
            pokemonTypes.innerHTML = pokemon.types.map(t => 
                `<span class="type-badge type-${t.type.name}">${t.type.name}</span>`
            ).join('');

            // Description
            const entry = species.flavor_text_entries.find(e => e.language.name === 'en');
            pokemonDescription.textContent = entry ? entry.flavor_text.replace(/\f|\n/g, ' ') : 'No description available.';

            // Physical stats
            pokemonHeight.textContent = `${(pokemon.height / 10).toFixed(1)}m`;
            pokemonWeight.textContent = `${(pokemon.weight / 10).toFixed(1)}kg`;

            // Stats
            const statNames = {
                'hp': 'HP',
                'attack': 'ATK',
                'defense': 'DEF',
                'special-attack': 'SP.A',
                'special-defense': 'SP.D',
                'speed': 'SPD'
            };

            const statClasses = {
                'hp': 'stat-hp',
                'attack': 'stat-atk',
                'defense': 'stat-def',
                'special-attack': 'stat-spa',
                'special-defense': 'stat-spd',
                'speed': 'stat-spe'
            };

            pokemonStats.innerHTML = pokemon.stats.map(s => {
                const percentage = Math.min((s.base_stat / 255) * 100, 100);
                return `
                    <div class="stat-row ${statClasses[s.stat.name]}">
                        <div class="stat-label">${statNames[s.stat.name]}</div>
                        <div class="stat-bar-container">
                            <div class="stat-bar" style="width: ${percentage}%"></div>
                        </div>
                        <div class="stat-value">${s.base_stat}</div>
                    </div>
                `;
            }).join('');

            // Store cry URL
            cryBtn.dataset.cryUrl = pokemon.cries?.latest || pokemon.cries?.legacy || '';
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Navigation buttons
            document.getElementById('btn-prev').addEventListener('click', () => {
                const newId = currentPokemonId > 1 ? currentPokemonId - 1 : GEN1_COUNT;
                loadPokemon(newId);
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                const newId = currentPokemonId < GEN1_COUNT ? currentPokemonId + 1 : 1;
                loadPokemon(newId);
            });

            // D-Pad
            document.getElementById('dpad-up').addEventListener('click', () => {
                const newId = currentPokemonId > 4 ? currentPokemonId - 4 : currentPokemonId;
                loadPokemon(newId);
            });

            document.getElementById('dpad-down').addEventListener('click', () => {
                const newId = currentPokemonId + 4 <= GEN1_COUNT ? currentPokemonId + 4 : currentPokemonId;
                loadPokemon(newId);
            });

            document.getElementById('dpad-left').addEventListener('click', () => {
                const newId = currentPokemonId > 1 ? currentPokemonId - 1 : GEN1_COUNT;
                loadPokemon(newId);
            });

            document.getElementById('dpad-right').addEventListener('click', () => {
                const newId = currentPokemonId < GEN1_COUNT ? currentPokemonId + 1 : 1;
                loadPokemon(newId);
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowLeft':
                        document.getElementById('btn-prev').click();
                        break;
                    case 'ArrowRight':
                        document.getElementById('btn-next').click();
                        break;
                    case 'ArrowUp':
                        document.getElementById('dpad-up').click();
                        break;
                    case 'ArrowDown':
                        document.getElementById('dpad-down').click();
                        break;
                }
            });

            // 3D rotation on drag
            let isDragging = false;
            let startX = 0;
            let currentRotation = 0;

            pokemonImage.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                pokemonImage.classList.add('dragging');
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - startX;
                currentRotation = deltaX * 0.5;
                pokemonImage.style.transform = `rotateY(${currentRotation}deg) scale(1.05)`;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    pokemonImage.classList.remove('dragging');
                    // Animate back to original position
                    pokemonImage.style.transition = 'transform 0.3s ease';
                    pokemonImage.style.transform = '';
                    setTimeout(() => {
                        pokemonImage.style.transition = '';
                    }, 300);
                }
            });

            // Touch support
            pokemonImage.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].clientX;
                pokemonImage.classList.add('dragging');
            });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const deltaX = e.touches[0].clientX - startX;
                currentRotation = deltaX * 0.5;
                pokemonImage.style.transform = `rotateY(${currentRotation}deg) scale(1.05)`;
            });

            document.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    pokemonImage.classList.remove('dragging');
                    pokemonImage.style.transition = 'transform 0.3s ease';
                    pokemonImage.style.transform = '';
                    setTimeout(() => {
                        pokemonImage.style.transition = '';
                    }, 300);
                }
            });

            // Play cry
            cryBtn.addEventListener('click', async () => {
                const cryUrl = cryBtn.dataset.cryUrl;
                if (cryUrl) {
                    try {
                        const audio = new Audio(cryUrl);
                        audio.volume = 0.3;
                        await audio.play();
                    } catch (error) {
                        console.log('Could not play cry:', error);
                    }
                }
            });
        }

        // Initialize the Pokedex
        init();
    </script>
</body>
</html>
